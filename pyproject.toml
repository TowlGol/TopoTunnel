[project]
name = "topotunnel"
version = "0.1.0"
description = "Topology-guided processing and visualization of protein tunnels"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.65",
    "PySide6>=6.6.0",
    "pyvista>=0.43.0",
    "pyvistaqt>=0.11.0",
    "vtk>=9.3.0",
    "pyqtgraph>=0.13.0",
]

[tool.uv]
# This repository is run directly from source; no wheel/editable package is needed.
package = false
